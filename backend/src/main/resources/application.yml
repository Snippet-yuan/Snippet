server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: snippet
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/snippet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:snippet}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${SNIPPET_ASSET_MAX_FILE_SIZE:10MB}
      max-request-size: ${SNIPPET_ASSET_MAX_REQUEST_SIZE:12MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

snippet:
  asset:
    storage-path: ${SNIPPET_ASSET_STORAGE_PATH:./data/assets}
    public-base-url: ${SNIPPET_ASSET_PUBLIC_BASE_URL:/api/v1/assets/files}
    max-file-size: ${SNIPPET_ASSET_MAX_FILE_SIZE:10MB}
  security:
    jwt:
      issuer: ${SNIPPET_JWT_ISSUER:snippet-backend}
      access-token-ttl: ${SNIPPET_JWT_ACCESS_TOKEN_TTL:PT2H}
      secret: ${SNIPPET_JWT_SECRET}
